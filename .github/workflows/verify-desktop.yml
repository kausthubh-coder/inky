name: Verify desktop

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  controlled:
    name: Controlled app regressions
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run test:all
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-test-evidence
          path: .agents/studi-qa/checks/
          include-hidden-files: true
          if-no-files-found: warn
