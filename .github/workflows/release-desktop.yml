name: Release desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Verify complete controlled release suite
        run: bun run test:release
      - run: bun run make:win
      - name: Verify PDF reading from the Windows package
        run: bunx electron tests/packaged-pdf.cjs out/Studi-win32-x64/resources/app.asar
      - name: Stage Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -ErrorAction Stop | Out-Null
          Copy-Item -LiteralPath "out/make/squirrel.windows/x64/Studi-Setup.exe" -Destination "release/Studi-Setup.exe"
          Copy-Item -LiteralPath "out/make/squirrel.windows/x64/RELEASES" -Destination "release/RELEASES"
          $packages = @(Get-ChildItem "out/make/squirrel.windows/x64/*-full.nupkg")
          if ($packages.Count -eq 0 -or @($packages | Where-Object Length -eq 0).Count -gt 0) { throw "Missing Squirrel update package" }
          $packages | Copy-Item -Destination release
          if (@(Get-ChildItem -LiteralPath release | Where-Object Length -eq 0).Count -gt 0) { throw "Empty staged Windows artifact" }
      - uses: actions/upload-artifact@v4
        with:
          name: studi-windows
          path: release/*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studi-windows-controlled-proof
          path: .agents/studi-qa/checks/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  macos:
    name: macOS universal disk image
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile --cpu '*'
      - name: Build macOS icon
        run: |
          mkdir -p assets/studi-inky.iconset
          sips -z 16 16 assets/studi-inky.png --out assets/studi-inky.iconset/icon_16x16.png >/dev/null
          sips -z 32 32 assets/studi-inky.png --out assets/studi-inky.iconset/icon_16x16@2x.png >/dev/null
          sips -z 32 32 assets/studi-inky.png --out assets/studi-inky.iconset/icon_32x32.png >/dev/null
          sips -z 64 64 assets/studi-inky.png --out assets/studi-inky.iconset/icon_32x32@2x.png >/dev/null
          sips -z 128 128 assets/studi-inky.png --out assets/studi-inky.iconset/icon_128x128.png >/dev/null
          sips -z 256 256 assets/studi-inky.png --out assets/studi-inky.iconset/icon_128x128@2x.png >/dev/null
          sips -z 256 256 assets/studi-inky.png --out assets/studi-inky.iconset/icon_256x256.png >/dev/null
          sips -z 512 512 assets/studi-inky.png --out assets/studi-inky.iconset/icon_256x256@2x.png >/dev/null
          sips -z 512 512 assets/studi-inky.png --out assets/studi-inky.iconset/icon_512x512.png >/dev/null
          cp assets/studi-inky.png assets/studi-inky.iconset/icon_512x512@2x.png
          iconutil -c icns assets/studi-inky.iconset -o assets/studi-inky.icns
      - name: Verify complete controlled release suite
        run: bun run test:release
      - run: bun run make:mac
      - name: Verify both packaged PDF renderer architectures
        run: |
          native="out/Studi-darwin-universal/Studi.app/Contents/Resources/app.asar.unpacked/node_modules/@napi-rs"
          lipo "$native/canvas-darwin-x64/skia.darwin-x64.node" -verify_arch x86_64
          lipo "$native/canvas-darwin-arm64/skia.darwin-arm64.node" -verify_arch arm64
      - name: Verify PDF reading from the universal Mac package
        run: bunx electron tests/packaged-pdf.cjs out/Studi-darwin-universal/Studi.app/Contents/Resources/app.asar
      - name: Stage macOS disk image
        run: |
          mkdir release
          count="$(find out/make -type f -name '*.dmg' | wc -l | tr -d ' ')"
          test "$count" = 1
          artifact="$(find out/make -type f -name '*.dmg')"
          test -s "$artifact"
          cp "$artifact" release/Studi-macOS.dmg
      - name: Verify staged DMG and native packaged first launch
        run: bash scripts/verify-macos-dmg.sh release/Studi-macOS.dmg out/Studi-darwin-universal/Studi.app native-proof/macos
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studi-macos-native-proof
          path: native-proof/macos/*
          if-no-files-found: warn
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: studi-macos
          path: release/Studi-macOS.dmg
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studi-macos-controlled-proof
          path: .agents/studi-qa/checks/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  windows-upgrade:
    name: Windows installed upgrade (${{ matrix.mode }})
    if: github.event_name == 'workflow_dispatch'
    needs: windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [setup, updater]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: studi-windows
          path: release
      - name: Install baseline and verify candidate persistence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-windows-upgrade.ps1 -Artifacts release -Mode '${{ matrix.mode }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studi-windows-${{ matrix.mode }}-native-proof
          path: native-proof/windows/**
          if-no-files-found: warn
          retention-days: 90

  release:
    name: Promote tested installers
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify evidence and the successful manual source run
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-evidence.mjs --tag "$GITHUB_REF_NAME" --verify-run --prepare-artifacts release --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: studi-windows
          run-id: ${{ steps.evidence.outputs.artifactRunId }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: studi-macos
          run-id: ${{ steps.evidence.outputs.artifactRunId }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: release
      - name: Verify exact tested assets and generate their checksum list
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-evidence.mjs --tag "$GITHUB_REF_NAME" --verify-run --artifacts release --write-checksums
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" release/* --verify-tag --title "Studi ${tag}" --generate-notes --latest
