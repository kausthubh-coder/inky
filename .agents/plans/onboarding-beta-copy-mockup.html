<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studi — proposed onboarding mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@600;700;800&family=Shantell+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbf7ee;
    --panel: #fffdf6;
    --ink: #3b342c;
    --muted: #7d746a;
    --line: #3b342c;
    --yellow: #f6c945;
    --sticky: #fff2b5;
    --coral: #ffe1d8;
    --mint: #8fcbaa;
    --sky: #8ab8e8;
    --pink: #f2a8c4;
    --shadow: 3px 4px 0 rgb(59 52 44 / 16%);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-width: 720px;
    color: var(--ink);
    font: 700 16px/1.45 "Nunito Sans", system-ui, sans-serif;
    background: radial-gradient(#e9e0cd 1.1px, transparent 1.1px) 0 0 / 24px 24px, var(--paper);
  }
  h1, h2, h3 { font-family: "Shantell Sans", cursive; letter-spacing: -0.03em; }
  button { color: inherit; font: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.52; }

  .review-bar {
    position: fixed; z-index: 20; left: 16px; right: 16px; bottom: 12px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
    padding: 8px 10px;
    border: 2px dashed #b3a99c; border-radius: 14px;
    background: rgb(255 253 246 / 94%);
    font-size: 12px; font-weight: 800;
  }
  .review-bar span { color: var(--muted); margin-right: 4px; }
  .review-bar a, .review-bar button {
    padding: 4px 9px; border: 1.5px solid var(--ink); border-radius: 999px;
    background: #fff; text-decoration: none; box-shadow: 1.5px 1.5px 0 rgb(59 52 44 / 14%);
  }
  .review-bar button.is-on { background: var(--sticky); }

  .stage {
    display: grid; min-height: 100vh;
    grid-template-columns: 1fr 0fr;
    transition: grid-template-columns 560ms cubic-bezier(.23, 1, .32, 1);
  }
  .stage.with-browser { grid-template-columns: minmax(300px, 0.92fr) minmax(360px, 1.18fr); }

  .talk {
    display: flex; min-width: 0; min-height: 0;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 36px 32px 88px;
  }
  .with-browser .talk {
    align-items: stretch; justify-content: flex-start;
    padding: 18px 16px 88px;
  }

  .inky-wrap {
    display: grid; place-items: center;
    width: 220px; height: 220px;
    background: radial-gradient(ellipse 62% 22% at 50% 88%, rgb(59 52 44 / 12%), transparent 70%);
  }
  .with-browser .inky-wrap { width: 84px; height: 84px; margin: 0 auto 2px; }
  .inky-mascot { display: block; width: 100%; height: 100%; }
  .inky-mascot svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .inky-mascot .body { transform-box: view-box; transform-origin: 60px 106px; animation: bob 1.4s ease-in-out infinite alternate; }
  .inky-mascot .inky-hand { transform-box: view-box; transform-origin: 8px 60px; animation: wave .32s ease-in-out infinite alternate; }

  .copy { display: flex; width: min(480px, 100%); flex-direction: column; align-items: center; }
  .with-browser .copy { width: 100%; flex: 1; min-height: 0; align-items: stretch; }
  .who { margin: 4px 0 12px; color: var(--muted); font: 800 14px/1 "Shantell Sans", cursive; }
  .with-browser .who { display: none; }

  .bubbles { display: flex; width: 100%; flex-direction: column; align-items: center; gap: 12px; }
  .with-browser .bubbles { flex: 1; align-items: stretch; overflow-y: auto; padding: 4px 2px 8px; }

  .speech {
    position: relative; width: 100%;
    padding: 16px 20px 15px;
    border: 2.5px solid var(--ink);
    border-radius: 28px 32px 30px 28px;
    background: #fff;
    box-shadow: var(--shadow);
  }
  .speech h1 { margin: 0 0 8px; font-size: 20px; font-weight: 800; line-height: 1.25; }
  .speech p { margin: 0; }
  .tail {
    position: absolute; top: -11px; left: 50%;
    width: 18px; height: 18px;
    border-top: 2.5px solid var(--ink); border-left: 2.5px solid var(--ink);
    border-radius: 3px 0 0; background: #fff;
    transform: translateX(-50%) rotate(45deg);
  }
  .me {
    align-self: flex-end; width: auto; max-width: 88%;
    padding: 10px 14px;
    border: 2.5px solid var(--ink);
    border-radius: 28px 26px 8px 26px;
    background: var(--sticky);
    font-size: 14px; font-weight: 800;
  }
  .with-browser .speech {
    align-self: flex-start; width: auto; max-width: 92%;
    padding: 11px 14px 12px;
    border-radius: 8px 22px 22px 18px;
    font-size: 14px;
  }
  .with-browser .speech h1 { margin-bottom: 4px; font-size: 15px; }
  .with-browser .tail { display: none; }
  .with-browser .me { align-self: flex-end; border-radius: 22px 8px 18px 22px; }

  .replies {
    display: flex; width: 100%; flex-wrap: wrap; justify-content: center; gap: 8px;
    margin-top: 14px;
  }
  .with-browser .replies {
    justify-content: flex-start; margin-top: 8px; padding-top: 10px;
    border-top: 2px dashed #cfc4b4;
  }
  .btn {
    display: inline-flex; min-height: 34px; align-items: center;
    padding: 7px 13px;
    border: 2px solid var(--ink);
    border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
    background: #fff;
    box-shadow: 2px 2px 0 rgb(59 52 44 / 16%);
    font-size: 12.5px; font-weight: 800;
  }
  .btn.primary { background: var(--yellow); box-shadow: 2px 2px 0 var(--ink); }
  .btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: none; }

  .quiet { margin-top: 12px; color: var(--muted); font-size: 12px; font-weight: 700; text-align: center; }
  .with-browser .quiet { text-align: left; }

  .codebox, .form, .picks { margin-top: 12px; }
  .codebox {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 12px;
    border: 2px dashed var(--ink);
    border-radius: 15px 18px 16px 14px;
    background: var(--paper);
  }
  .codebox strong { font: 800 22px/1.1 "Shantell Sans", cursive; letter-spacing: 0.06em; }
  .codebox .fallback { display: block; margin-top: 8px; color: var(--ink); font-size: 12.5px; font-weight: 800; }
  .codebox .fallback a { color: inherit; }
  .hint { margin: 6px 0 0; color: var(--muted); font-size: 12px; font-weight: 700; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 11px; font-weight: 800; }
  input {
    height: auto; padding: 8px 11px;
    border: 2px solid var(--ink); border-radius: 12px;
    background: var(--panel); color: var(--ink);
    font: 700 14px/1.3 "Nunito Sans", sans-serif;
  }
  .picks { display: flex; flex-direction: column; gap: 8px; }
  .pick {
    padding: 10px 12px; border: 2px solid #cfc4b4;
    border-radius: 15px 18px 16px 14px;
    background: #fff; text-align: left;
  }
  .pick.on { border-color: var(--ink); background: var(--sticky); box-shadow: 2px 2px 0 rgb(59 52 44 / 12%); }
  .pick strong { display: block; font-size: 13.5px; }
  .pick strong small { color: var(--muted); font-size: 11px; }
  .pick span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .note {
    margin-top: 10px; padding: 10px 12px;
    border: 2px dashed #cfc4b4; border-radius: 12px;
    background: var(--paper);
  }
  .note label { margin-top: 6px; }
  .note textarea {
    min-height: 64px; padding: 8px 10px;
    border: 2px solid var(--ink); border-radius: 10px;
    background: #fff; color: var(--ink);
    font: 700 13px/1.4 "Nunito Sans", sans-serif; resize: vertical;
  }

  .school {
    display: flex; min-width: 0; overflow: hidden;
    flex-direction: column; opacity: 0; pointer-events: none;
    transform: translateX(28px);
    transition: opacity 480ms 60ms cubic-bezier(.23, 1, .32, 1), transform 560ms cubic-bezier(.23, 1, .32, 1);
  }
  .with-browser .school {
    opacity: 1; pointer-events: auto; transform: none;
    padding: 28px 18px 18px 8px;
  }
  .page {
    flex: 1; min-height: 0;
    padding: 22px;
    border: 0;
    border-radius: 22px 20px 24px 18px;
    background: #fff;
    box-shadow: 4px 5px 0 rgb(59 52 44 / 12%);
  }
  .page h3 { margin: 0 0 6px; font-size: 18px; }
  .page p { margin: 0; color: var(--muted); font-size: 13px; }
  .course { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 14px; }
  .dot { width: 10px; height: 10px; border: 1.5px solid var(--ink); border-radius: 50%; }
  .done { margin-top: 72px; text-align: center; }
  .done h1 { font-size: 42px; margin: 0 0 8px; }

  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
  @keyframes wave { from { transform: rotate(-16deg); } to { transform: rotate(14deg); } }
  @media (prefers-reduced-motion: reduce) {
    .inky-mascot .body, .inky-mascot .inky-hand, .stage, .school { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main class="stage" id="stage" role="application" aria-label="Talking to Inky">
    <section class="talk">
      <div class="inky-wrap" id="inky"></div>
      <div class="copy">
        <div class="who">talking to Inky</div>
        <div class="bubbles" id="bubbles"></div>
        <div class="replies" id="replies"></div>
        <p class="quiet" id="quiet" hidden></p>
      </div>
    </section>
    <aside class="school" aria-label="School browser">
      <div class="page" id="page"></div>
    </aside>
  </main>

  <div class="review-bar">
    <span>Review jumps</span>
    <button type="button" data-jump="hi">Sign in</button>
    <button type="button" data-jump="browser">Browser opened</button>
    <button type="button" data-jump="waitlist">Waitlist</button>
    <button type="button" data-jump="device">Other computer</button>
    <button type="button" data-jump="in">You're in</button>
    <button type="button" data-jump="brain">ChatGPT code</button>
    <button type="button" data-jump="school">School</button>
    <button type="button" data-jump="desk">Scan split</button>
    <button type="button" data-jump="week">Week</button>
    <a href="onboarding-beta-copy-plan.html">Open plan</a>
  </div>

<script>
const INKY = `<svg viewBox="-16 0 136 120" focusable="false"><ellipse cx="60" cy="111" rx="26" ry="5" fill="#3b342c" opacity="0.1"/><g class="body"><path d="M60 15 C86 11 105 31 104 58 C103 88 87 107 60 106 C33 105 16 88 16 58 C16 31 34 19 60 15 Z" fill="#8ab8e8" stroke="#3b342c" stroke-width="3.5" stroke-linejoin="round"/><path d="M60 15 Q57 5 66 3" stroke="#3b342c" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="45" cy="56" rx="5" ry="7" fill="#3b342c"/><ellipse cx="75" cy="56" rx="5" ry="7" fill="#3b342c"/><circle cx="47" cy="53" r="1.8" fill="#fff"/><circle cx="77" cy="53" r="1.8" fill="#fff"/><path d="M48 72 Q60 86 72 72" stroke="#3b342c" stroke-width="3" fill="#fff" stroke-linecap="round"/><ellipse cx="33" cy="66" rx="6" ry="4" fill="#f2a8c4" opacity="0.8"/><ellipse cx="87" cy="66" rx="6" ry="4" fill="#f2a8c4" opacity="0.8"/></g><text class="inky-hand" x="8" y="60" text-anchor="middle" dominant-baseline="middle" font-size="30">🤚</text></svg>`;

const STEPS = {
  hi: {
    title: "Hey.",
    body: "I'm Inky. I'll help with your homework. First, sign into Studi.",
    replies: [{ label: "Hi Inky", go: "browser", primary: true }]
  },
  browser: {
    title: "A page just opened.",
    body: "Sign in there, then come back.",
    replies: [{ label: "I'm signed in", go: "in", primary: true }, { label: "Open it again", go: "browser" }]
  },
  waitlist: {
    title: "Not yet.",
    body: "You're on the waitlist. I'll wait.",
    extra: "note",
    replies: [{ label: "Check again", go: "in", primary: true }, { label: "Use another account", go: "hi" }]
  },
  device: {
    title: "You're already signed in somewhere else.",
    body: "Studi only works on one laptop at a time.",
    replies: [{ label: "Check again", go: "in", primary: true }, { label: "Use another account", go: "hi" }]
  },
  in: {
    title: "Hey Maya.",
    body: "Nice. Now I need ChatGPT so I can do the work.",
    me: "Hi Inky",
    replies: [{ label: "Let's do it", go: "brain", primary: true }]
  },
  brain: {
    title: "I need ChatGPT.",
    body: "Type this code on the page that opened.",
    extra: "code",
    replies: [{ label: "I typed it", go: "school", primary: true }, { label: "Back", go: "in" }]
  },
  school: {
    title: "Where's class?",
    body: "Paste the link you open for homework. Moodle, Canvas, Classroom — whatever yours is.",
    extra: "school",
    replies: [{ label: "That's the one", go: "perm", primary: true }, { label: "Back", go: "brain" }]
  },
  perm: {
    title: "When I find homework…",
    body: "What should I do? You can change this later.",
    extra: "perm",
    replies: [{ label: "Use this", go: "peek", primary: true }, { label: "Back", go: "school" }]
  },
  peek: {
    title: "How often should I check?",
    body: "I'll look even if you close Studi.",
    extra: "sched",
    replies: [{ label: "Sounds good. Open school.", go: "turn", primary: true }, { label: "Back", go: "perm" }]
  },
  turn: {
    desk: true,
    title: "Your turn.",
    body: "Sign in on the right. I can't see your password.",
    me: "Opening school.",
    page: "login",
    replies: [{ label: "I'm signed in. Look around.", go: "scan", primary: true }, { label: "Back", go: "peek" }]
  },
  scan: {
    desk: true,
    title: "Looking around.",
    body: "Classes and homework. I only count what I can see.",
    me: "I'm signed in. Look around.",
    page: "scan",
    replies: [{ label: "Keep going", go: "wa", primary: true }]
  },
  wa: {
    desk: true,
    title: "WebAssign wants you to sign in.",
    body: "Do that on the right, then tell me.",
    page: "wa",
    replies: [{ label: "I'm signed in. Continue", go: "week", primary: true }]
  },
  week: {
    desk: true,
    title: "Your week is ready.",
    body: "I skip quizzes. I do the work. You hit submit.",
    page: "done",
    replies: [{ label: "Open my week", go: "board", primary: true }]
  },
  board: { board: true }
};

const S = { step: "hi", url: "", perm: "attempt", sched: "daily" };
const ORDER = ["hi", "browser", "in", "brain", "school", "perm", "peek", "turn", "scan", "wa", "week"];

function extra(kind) {
  if (kind === "code") return `<div class="codebox"><div><strong>WJ7K-9PQ2</strong><span class="fallback">If the page didn't open, <a href="https://chatgpt.com/auth/device" target="_blank" rel="noreferrer">click this link</a>.</span></div><button type="button" class="btn" data-copy="WJ7K-9PQ2">Copy</button></div>`;
  if (kind === "school") return `<div class="form"><label>Class link<input id="url" value="${S.url}" placeholder="https://" spellcheck="false"></label><p class="hint">Any class site works. Those names are just examples.</p></div>`;
  if (kind === "perm") return `<div class="picks">${[
    ["skip", "Don't try it", "I'll leave it alone."],
    ["attempt", "Do it, I'll submit", "I do the work. You hit submit.", "default"],
    ["auto", "Do it and submit", "Only if you really want that."]
  ].map(([id, t, d, def]) => `<button type="button" class="pick${S.perm === id ? " on" : ""}" data-perm="${id}"><strong>${t}${def ? " <small>· default</small>" : ""}</strong><span>${d}</span></button>`).join("")}</div>`;
  if (kind === "sched") return `<div class="picks">${[
    ["daily", "Every morning"], ["weekly", "Once a week"], ["manual", "Only when I ask"]
  ].map(([id, t]) => `<button type="button" class="pick${S.sched === id ? " on" : ""}" data-sched="${id}"><strong>${t}</strong></button>`).join("")}</div>`;
  if (kind === "note") return `<div class="note"><strong>Want to leave a note?</strong><label>Note for the beta team<textarea placeholder="Optional"></textarea></label></div>`;
  return "";
}

function pageHtml(kind) {
  if (kind === "login") return `<h3>University Moodle</h3><p>Sign in here. I can't see the password.</p><div class="course"><span class="dot" style="background:#f7c948"></span><div><strong>Sign in</strong><p>Your class site.</p></div></div>`;
  if (kind === "scan") return `<h3>University Moodle</h3><p>Looking at your classes.</p><div class="course"><span class="dot" style="background:#f7c948"></span><div><strong>HIST 210</strong><p>finding homework…</p></div></div><div class="course"><span class="dot" style="background:#f28b6f"></span><div><strong>CALC 1</strong><p>needs WebAssign too</p></div></div>`;
  if (kind === "wa") return `<h3>WebAssign</h3><p>Sign in here too.</p><div class="course"><span class="dot" style="background:#8ab8e8"></span><div><strong>CALC 1 login</strong><p>same as class</p></div></div>`;
  if (kind === "done") return `<h3>University Moodle</h3><p>What I found.</p><div class="course"><span class="dot" style="background:#8fcbaa"></span><div><strong>HIST 210</strong><p>essay due tonight</p></div></div><div class="course"><span class="dot" style="background:#8fcbaa"></span><div><strong>CALC 1</strong><p>WebAssign pset 4</p></div></div>`;
  return `<p>School isn't open yet.</p>`;
}

function speech(step, extras) {
  return `<article class="speech"><span class="tail" aria-hidden="true"></span><h1>${step.title}</h1><p>${step.body}</p>${extras ? extra(step.extra) : ""}</article>`;
}

function restoreTalk() {
  const talk = document.querySelector(".talk");
  if (document.getElementById("inky") && document.getElementById("bubbles")) return;
  talk.innerHTML = `<div class="inky-wrap" id="inky"></div>
    <div class="copy">
      <div class="who">talking to Inky</div>
      <div class="bubbles" id="bubbles"></div>
      <div class="replies" id="replies"></div>
      <p class="quiet" id="quiet" hidden></p>
    </div>`;
}

function paint() {
  const step = STEPS[S.step];
  if (step.board) {
    document.getElementById("stage").className = "stage";
    document.querySelector(".talk").innerHTML = `<div class="done"><div class="inky-wrap">${INKY}</div><h1>Hey Maya — 2 things due tonight.</h1><p>This mockup stops at the board. Implementation stays off until you approve the copy.</p></div>`;
    document.querySelectorAll("[data-jump]").forEach((el) => el.classList.toggle("is-on", el.dataset.jump === "week"));
    return;
  }
  restoreTalk();
  document.getElementById("inky").innerHTML = `<span class="inky-mascot">${INKY}</span>`;
  const desk = !!step.desk;
  document.getElementById("stage").classList.toggle("with-browser", desk);
  document.getElementById("page").innerHTML = pageHtml(step.page);
  const bits = [];
  if (desk) {
    for (const id of ORDER) {
      const st = STEPS[id];
      if (!st || ORDER.indexOf(id) > ORDER.indexOf(S.step)) continue;
      if (!["turn", "scan", "wa", "week"].includes(id)) continue;
      if (st.me) bits.push(`<div class="me">${st.me}</div>`);
      bits.push(speech(st, id === S.step));
    }
  } else {
    if (step.me) bits.push(`<div class="me">${step.me}</div>`);
    bits.push(speech(step, true));
  }
  document.getElementById("bubbles").innerHTML = bits.join("");
  document.getElementById("replies").innerHTML = (step.replies || []).map((r) =>
    `<button type="button" class="btn${r.primary ? " primary" : ""}" data-go="${r.go}">${r.label}</button>`
  ).join("");
  const quiet = document.getElementById("quiet");
  quiet.hidden = !step.quiet;
  quiet.textContent = step.quiet || "";
  document.querySelectorAll("[data-jump]").forEach((el) => el.classList.toggle("is-on", el.dataset.jump === S.step));
}

document.addEventListener("click", (event) => {
  const copy = event.target.closest("[data-copy]");
  const go = event.target.closest("[data-go]");
  const jump = event.target.closest("[data-jump]");
  const perm = event.target.closest("[data-perm]");
  const sched = event.target.closest("[data-sched]");
  if (copy) {
    event.preventDefault();
    const value = copy.dataset.copy;
    if (navigator.clipboard) navigator.clipboard.writeText(value).catch(() => {});
    copy.textContent = "Copied";
    window.setTimeout(() => { copy.textContent = "Copy"; }, 1200);
    return;
  }
  if (go) { S.step = go.dataset.go; paint(); }
  if (jump) { S.step = jump.dataset.jump; paint(); }
  if (perm) { S.perm = perm.dataset.perm; paint(); }
  if (sched) { S.sched = sched.dataset.sched; paint(); }
});
document.addEventListener("input", (event) => {
  if (event.target.id === "url") S.url = event.target.value;
});
paint();
</script>
</body>
</html>
