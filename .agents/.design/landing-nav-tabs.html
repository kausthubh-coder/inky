<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Landing nav — Notebook tabs</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .spine {
      position: fixed;
      z-index: 40;
      top: 0;
      right: 0;
      left: 0;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      height: 64px;
      padding: 0 22px;
      border-bottom: 3px solid var(--ink);
      background: #efe4c8;
      box-shadow: inset 0 -8px 0 #e4d6b4;
    }
    .wordmark {
      margin-right: auto;
      padding-bottom: 12px;
      font-size: 24px;
      font-weight: 800;
      text-decoration: none;
    }
    .tab {
      display: inline-flex;
      align-items: center;
      height: 36px;
      padding: 0 16px;
      border: 2.5px solid var(--ink);
      border-bottom: 0;
      border-radius: 12px 14px 0 0;
      background: #efe4c8;
      color: var(--ink-soft);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }
    .tab:hover { background: var(--sticky); color: var(--ink); }
    .tab.on {
      background: var(--paper);
      color: var(--ink);
      box-shadow: 0 3px 0 var(--paper);
    }
    .seat {
      align-self: center;
      margin-left: 10px;
      rotate: 2.5deg;
    }
    .hero-dummy { padding-top: 108px; }
    .rule {
      height: 1px;
      margin: 18px 0;
      background: repeating-linear-gradient(90deg, #d2c4a8 0 8px, transparent 8px 14px);
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← board</a>
  <header class="spine">
    <a class="wordmark" href="#">studi</a>
    <nav aria-label="Page">
      <a class="tab" href="#">Inky</a>
      <a class="tab on" href="#">Trust</a>
      <a class="tab" href="#">FAQ</a>
      <a class="tab" href="#">Mission</a>
    </nav>
    <a class="btn sunny seat" href="#">Save me a seat</a>
  </header>

  <section class="hero-dummy">
    <p class="kicker">Landing · variation B</p>
    <h1>Open the book. I’m on the first page.</h1>
    <p>The landing is a notebook. You don’t “navigate a site.” You flip to the tab you care about.</p>
    <div class="rule"></div>
    <p>Active tab melts into the paper so the page and the nav are the same object.</p>
  </section>
</body>
</html>
