<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App top bar — The assignment is the bar</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .bar {
      position: sticky; top: 0; z-index: 20;
      display: grid;
      grid-template-columns: auto minmax(240px, 1fr) auto;
      align-items: center; gap: 14px;
      height: 60px; padding: 0 16px;
      border-bottom: 2px solid var(--ink);
      background: rgb(255 250 240 / 96%);
    }
    .wordmark { font-size: 20px; font-weight: 800; text-decoration: none; }
    .work {
      display: grid; gap: 5px;
      padding: 6px 10px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: #fff;
      text-decoration: none;
    }
    .work span { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; }
    .track {
      height: 7px;
      overflow: hidden;
      border: 1.5px solid var(--ink);
      border-radius: 99px;
      background: #efe6cf;
    }
    .track i {
      display: block; width: 62%; height: 100%;
      background: var(--mint);
    }
    .end { display: flex; align-items: center; gap: 8px; }
    .you {
      display: grid; width: 32px; height: 32px; place-items: center;
      border: 2px solid var(--ink); border-radius: 50%;
      background: var(--pink); font-weight: 900; text-decoration: none;
    }
    .caption { max-width: 1100px; margin: 20px auto 0; padding: 0 24px; font-weight: 700; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← board</a>
  <header class="bar">
    <a class="wordmark" href="#">studi</a>
    <a class="work" href="#">
      <span>Bio 201 · lab writeup <small>Inky · watching</small></span>
      <div class="track" aria-hidden="true"><i></i></div>
    </a>
    <div class="end">
      <a class="btn quiet" href="#">Week</a>
      <a class="you" href="settings-sidebar.html">K</a>
    </div>
  </header>
  <p class="caption">Top bar · variation G. The thing in progress is the chrome. Click the bar, you’re at the desk. Week is a quiet exit.</p>
  <section class="week-ghost" aria-hidden="true">
    <article><strong>Today</strong><i></i><i></i></article>
    <article><strong>Friday</strong><i></i></article>
    <article><strong>Saturday</strong></article>
    <article><strong>Sunday</strong><i></i></article>
    <article><strong>Monday</strong><i></i><i></i></article>
  </section>
</body>
</html>
