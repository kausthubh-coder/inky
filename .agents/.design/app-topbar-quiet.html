<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App top bar — Quiet pulse</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .bar {
      position: sticky; top: 0; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      height: 52px; padding: 0 18px;
      border-bottom: 2px solid var(--ink);
      background: rgb(255 250 240 / 96%);
    }
    .wordmark { font-size: 20px; font-weight: 800; text-decoration: none; }
    .pulse {
      position: relative;
      width: 36px; height: 36px;
      padding: 0; border: 0; background: transparent;
    }
    .pulse svg { width: 36px; height: 36px; }
    .pulse i {
      position: absolute; right: 1px; top: 1px;
      width: 9px; height: 9px;
      border: 1.5px solid var(--ink); border-radius: 50%;
      background: #2f9e62;
      animation: glow 1.6s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgb(47 158 98 / 0); }
      50% { box-shadow: 0 0 0 5px rgb(47 158 98 / 22%); }
    }
    .hint {
      opacity: 0;
      color: var(--ink-soft);
      font-size: 12px;
      font-weight: 800;
      transition: opacity 180ms var(--ease);
    }
    .pulse:hover + .hint, .bar:has(.pulse:hover) .hint { opacity: 1; }
    .spacer { flex: 1; }
    .you {
      display: grid; width: 30px; height: 30px; place-items: center;
      border: 2px solid var(--ink); border-radius: 50%;
      background: var(--pink); font-weight: 900; font-size: 12px; text-decoration: none;
    }
    .caption { max-width: 1100px; margin: 20px auto 0; padding: 0 24px; font-weight: 700; }
  </style>
</head>
<body>
  <a class="back" href="index.html">← board</a>
  <header class="bar">
    <a class="wordmark" href="#">studi</a>
    <button class="pulse" type="button" title="Open Inky’s desk">
      <svg class="inky" viewBox="0 0 120 120" aria-hidden="true"><g class="body"><path d="M60 15 C86 11 105 31 104 58 C103 88 87 107 60 106 C33 105 16 88 16 58 C16 31 34 19 60 15 Z" fill="#8ab8e8" stroke="#3b342c" stroke-width="3.5" stroke-linejoin="round"/><g class="eyes"><ellipse cx="45" cy="56" rx="5" ry="7" fill="#3b342c"/><ellipse cx="75" cy="56" rx="5" ry="7" fill="#3b342c"/></g></g></svg>
      <i></i>
    </button>
    <span class="hint">On Bio · watching</span>
    <span class="spacer"></span>
    <a class="you" href="settings-sidebar.html">K</a>
  </header>
  <p class="caption">Top bar · variation F. Almost no chrome. A green pulse means he’s working. Hover to hear what. Click him for the desk.</p>
  <section class="week-ghost" aria-hidden="true">
    <article><strong>Today</strong><i></i><i></i></article>
    <article><strong>Friday</strong><i></i></article>
    <article><strong>Saturday</strong></article>
    <article><strong>Sunday</strong><i></i></article>
    <article><strong>Monday</strong><i></i><i></i></article>
  </section>
</body>
</html>
