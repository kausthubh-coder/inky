<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App top bar — Inky is here</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    .bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: grid;
      grid-template-columns: 140px 1fr auto;
      align-items: center;
      height: 58px;
      padding: 0 18px 0 20px;
      border-bottom: 2px solid var(--ink);
      background: rgb(255 250 240 / 96%);
    }
    .wordmark { font-size: 20px; font-weight: 800; text-decoration: none; }
    .presence {
      justify-self: center;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 3px 12px 3px 4px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: #dff4e9;
      box-shadow: 2px 2px 0 rgba(28, 22, 18, 0.16);
      text-decoration: none;
    }
    .presence svg { width: 40px; height: 40px; }
    .presence strong { display: block; font-size: 13px; line-height: 1.15; }
    .presence small { color: var(--ink-soft); font-size: 11px; font-weight: 800; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #2f9e62; border: 1px solid var(--ink);
      box-shadow: 0 0 0 3px rgb(47 158 98 / 18%);
    }
    .end { display: flex; align-items: center; gap: 8px; }
    .gear {
      width: 34px; height: 34px;
      border: 2px solid transparent;
      border-radius: 50%;
      background: transparent;
      font-size: 16px;
    }
    .gear:hover { background: var(--sticky); }
    .you {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 8px 3px 3px;
      border-radius: 999px;
      font-size: 13px; font-weight: 800;
      text-decoration: none;
    }
    .you:hover { background: var(--sticky); }
    .you i {
      display: grid; width: 28px; height: 28px; place-items: center;
      border: 2px solid var(--ink); border-radius: 50%;
      background: var(--pink); font-style: normal; font-size: 12px;
    }
    .caption {
      max-width: 1100px;
      margin: 20px auto 0;
      padding: 0 24px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <a class="back" href="index.html">← board</a>
  <header class="bar">
    <a class="wordmark" href="#">studi</a>
    <a class="presence" href="#" title="Open Inky’s desk">
      <svg class="inky" viewBox="0 0 120 120" aria-hidden="true">
        <g class="body">
          <path d="M60 15 C86 11 105 31 104 58 C103 88 87 107 60 106 C33 105 16 88 16 58 C16 31 34 19 60 15 Z" fill="#8ab8e8" stroke="#3b342c" stroke-width="3.5" stroke-linejoin="round"/>
          <path d="M60 15 Q57 5 66 3" stroke="#3b342c" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="45" cy="56" r="11" fill="#fff" stroke="#3b342c" stroke-width="3"/>
          <circle cx="75" cy="56" r="11" fill="#fff" stroke="#3b342c" stroke-width="3"/>
          <line x1="56" y1="56" x2="64" y2="56" stroke="#3b342c" stroke-width="3"/>
          <circle cx="45" cy="56" r="3.5" fill="#3b342c"/>
          <circle cx="75" cy="56" r="3.5" fill="#3b342c"/>
        </g>
      </svg>
      <span>
        <strong>On the Bio lab writeup</strong>
        <small><span class="dot"></span> watching the page · you still submit</small>
      </span>
    </a>
    <div class="end">
      <a class="gear" href="settings-sidebar.html" title="Settings">⚙</a>
      <a class="you" href="settings-sidebar.html"><i>K</i>Kaustubh</a>
    </div>
  </header>
  <p class="caption">Top bar · variation A. No “This week” tab — you’re already there. Inky is the desk. Settings lives on you.</p>
  <section class="week-ghost" aria-hidden="true">
    <article><strong>Today</strong><i></i><i></i></article>
    <article><strong>Friday</strong><i></i></article>
    <article><strong>Saturday</strong></article>
    <article><strong>Sunday</strong><i></i></article>
    <article><strong>Monday</strong><i></i><i></i></article>
  </section>
</body>
</html>
