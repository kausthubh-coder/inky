<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Studi redesign concept v5</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="inky.css">
<style>
@font-face{font-family:"Nunito Sans";font-weight:400;font-display:swap;src:url("../../node_modules/@fontsource/nunito-sans/files/nunito-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Nunito Sans";font-weight:600;font-display:swap;src:url("../../node_modules/@fontsource/nunito-sans/files/nunito-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Nunito Sans";font-weight:700;font-display:swap;src:url("../../node_modules/@fontsource/nunito-sans/files/nunito-sans-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Shantell Sans";font-weight:600;font-display:swap;src:url("../../node_modules/@fontsource/shantell-sans/files/shantell-sans-latin-600-normal.woff2") format("woff2")}
/* A notebook on a desk. Type roles: display 30, voice 17, title 16, body 15, meta 13, label 12.5. Space: 4 base; 4 inside a group, 32 between groups. */
:root{--pencil:#2b2621;--graphite:#7f766b;--rule:#ebe4d6;--paper:#fbf7ee;--page:#fffdf8;--blotter:#f2ebdd;--blot2:#e9e0ce;--highlighter:#f6c945;--redpen:#b3452f;--csc:#a993d6;--st:#7fbf9f;--r:10px}
[data-mode=learn]{--highlighter:#cdbcf0}
*{box-sizing:border-box}
body{margin:0;background:#26221d;color:var(--pencil);font:400 15px/1.5 "Nunito Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,.voice{font-family:"Shantell Sans",cursive;font-weight:600;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1.1;letter-spacing:-.01em}h2{font-size:17px;line-height:1.2}
p{margin:0;text-wrap:pretty}b{font-weight:700}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input,textarea{font:inherit;color:inherit}
code{font:12px/1.45 ui-monospace,Consolas,monospace;color:var(--graphite);overflow-wrap:anywhere}
.muted{color:var(--graphite)}.late{color:var(--redpen);font-weight:600}.num{font-variant-numeric:tabular-nums}.sm{font-size:13px}
.label{font-size:12.5px;font-weight:600;color:var(--graphite);white-space:nowrap}
.h{font-size:15px;font-weight:700;color:var(--pencil);white-space:nowrap}.h em{font-style:normal;font-weight:600;color:var(--graphite);margin-left:6px}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
.inky-mascot{display:inline-block;flex:none}

/* concept chrome */
.bar{position:sticky;top:0;z-index:30;display:flex;gap:4px;align-items:center;padding:10px 18px;background:#26221d;color:#cfc6b6;font-size:12.5px;flex-wrap:wrap}
.bar strong{color:#f3ecdf;margin-right:14px}
.bar button{padding:4px 11px;border-radius:99px;color:#cfc6b6}
.bar button[aria-current=true]{background:#f3ecdf;color:#26221d;font-weight:700}
.bar i{width:1px;height:14px;background:#4a433a;margin:0 8px}
.scen{width:1244px;margin:0 auto 8px;display:flex;gap:4px;align-items:center;color:#8f8677;font-size:12.5px;flex-wrap:wrap}
.scen span{margin:0 8px 0 0}.scen button+span{margin-left:14px}.scen button{padding:3px 10px;border-radius:99px;color:#cfc6b6;border:1px solid #4a433a}
.scen button.on{background:#4a433a;color:#f3ecdf}
.screen{padding:0 18px 28px}
.frame{width:1244px;height:790px;margin:0 auto;border-radius:12px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;position:relative}
.why{width:1244px;margin:12px auto 0;color:#b5ab9b;font-size:13px;display:flex;gap:28px}.why p{flex:1}.why b{color:#f3ecdf}

/* controls: filled, outlined, quiet */
.btn,.q{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;font-weight:600;border-radius:var(--r);transition:transform .1s ease-out,background-color .15s ease-out}
.btn:active,.q:active,.send:active{transform:scale(.96)}
.btn{height:36px;padding:0 16px;font-size:14px;background:var(--page);box-shadow:0 0 0 1.5px var(--pencil)}
.btn.pri{background:var(--highlighter);box-shadow:0 0 0 1.5px var(--pencil),0 2.5px 0 1.5px var(--pencil)}
.btn.lg{height:44px;padding:0 22px;font-size:15px}
.q{height:30px;padding:0 11px;font-size:13px;background:var(--blotter);border-radius:8px}
.q:hover{background:var(--blot2)}.q.on{background:var(--pencil);color:var(--paper)}
.q.white{background:var(--page);box-shadow:0 0 0 1px var(--rule)}.q.white:hover{background:var(--paper)}
.q.ico{width:30px;padding:0;font-size:16px}
.car{display:inline-block;font-size:10px;color:var(--graphite);transition:transform .15s ease-out}.q.on .car{color:inherit}.on>.car,.open .car{transform:rotate(180deg)}
.lnk{color:var(--pencil);text-decoration:underline;text-decoration-color:#cfc6b6;text-underline-offset:3px;text-decoration-thickness:from-font}

/* shell */
.top{display:flex;align-items:center;height:60px;padding:0 28px;flex:none}
.top .logo{font:600 22px "Shantell Sans";width:280px}
.top .right{width:280px;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.switch{margin:0 auto;display:grid;grid-template-columns:132px 132px;padding:4px;border-radius:14px;background:var(--blotter);position:relative}
.switch .thumb{position:absolute;top:4px;left:4px;width:132px;height:34px;border-radius:10px;background:var(--highlighter);box-shadow:0 0 0 1.5px var(--pencil),0 2px 0 1.5px var(--pencil);transition:transform .28s cubic-bezier(.3,1.4,.5,1)}
.switch.learn .thumb{transform:translateX(132px)}
.switch.fromhome .thumb{animation:toLearn .32s cubic-bezier(.3,1.4,.5,1)}.switch.fromlearn .thumb{animation:toHome .32s cubic-bezier(.3,1.4,.5,1)}
@keyframes toLearn{from{transform:translateX(0)}}@keyframes toHome{from{transform:translateX(132px)}}
.switch button{position:relative;height:34px;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:600;font-size:14px;color:var(--graphite)}
.switch button.on{color:var(--pencil);font-weight:700}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blotter);display:grid;place-items:center;font-weight:700;font-size:12.5px;cursor:pointer}
.page{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;position:relative}
.colm{width:752px;margin:0 auto;padding:22px 16px 8px;flex:1;min-height:0;overflow:auto;scrollbar-width:none}
.colm.wide{width:1072px}
.hello{display:flex;gap:18px;align-items:center;margin-bottom:26px}.hello p{margin-top:6px;font-size:16px;line-height:1.4}
.sec{display:flex;align-items:center;justify-content:space-between;margin:32px 0 6px;gap:14px}
.seg{display:inline-flex;padding:3px;border-radius:var(--r);background:var(--blotter)}
.seg button{padding:4px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--graphite)}
.seg button.on{background:var(--page);color:var(--pencil);box-shadow:0 1px 2px rgb(43 38 33/14%)}
.seg.sm button{padding:3px 10px;font-size:12.5px}
.panel .seg{background:var(--blot2)}
.foot{margin-top:28px;padding:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--graphite)}
.meter{height:4px;border-radius:9px;background:var(--blot2);overflow:hidden}
.meter i{display:block;height:100%;width:100%;background:var(--pencil);transform-origin:left;transform:scaleX(var(--p,.1));transition:transform .5s ease-out}
.meter.mini{width:90px;display:inline-block;vertical-align:middle;margin:0 8px}

/* generic rows: spacing, no rules */
.row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:11px 0}
.row .t{font-weight:700;font-size:15.5px;line-height:1.3}.row .m{font-size:13px;color:var(--graphite);margin-top:2px}
.row.pick{grid-template-columns:1fr auto;cursor:pointer;padding:12px 14px;margin:0 -14px 4px;border-radius:12px;transition:background-color .15s ease-out}
.row.pick:hover{background:var(--blotter)}.row.pick.on{background:var(--blotter);box-shadow:inset 3px 0 0 var(--highlighter)}

/* assignment items: a row that opens into one rounded card */
.cardw{margin:0 -14px;border-radius:16px;transition:background-color .15s ease-out}
.cardw.open{background:var(--page);box-shadow:0 0 0 1.5px var(--pencil),0 3px 0 1.5px var(--pencil);margin:8px -14px 14px}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:11px 14px;border-radius:16px;cursor:pointer;transition:background-color .15s ease-out}
.item:hover{background:var(--blotter)}.cardw.open .item:hover{background:none}
.item .cb{width:4px;height:34px;border-radius:4px;background:var(--c,var(--blot2))}
.item .t{font-weight:700;font-size:16px;line-height:1.3}.item .m{font-size:13px;color:var(--graphite);margin-top:2px}
.item .when{font-size:13px;color:var(--graphite);text-align:right}
.item.calm .t{font-weight:600;font-size:15px}
.cardw.flash{animation:flash 1.6s ease-out 1}
@keyframes flash{from{background:color-mix(in srgb,var(--highlighter) 50%,transparent)}to{background:transparent}}
.more{padding:2px 18px 16px 32px}
.more dl{display:grid;grid-template-columns:96px 1fr;gap:7px 14px;margin:0 0 16px;font-size:13.5px}
.more dt{color:var(--graphite)}.more dd{margin:0}
.more .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.askbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px 0 8px;border-radius:var(--r);font-size:14px;font-weight:600;background:var(--blotter);transition:transform .1s ease-out,background-color .15s ease-out}
.askbtn:hover{background:var(--blot2)}.askbtn:active{transform:scale(.96)}
.wrongbtn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 10px;margin-left:auto;border-radius:var(--r);font-size:13px;font-weight:600;color:var(--graphite);transition:background-color .15s ease-out}
.wrongbtn::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--redpen)}
.wrongbtn:hover,.wrongbtn.on{background:color-mix(in srgb,var(--redpen) 10%,transparent);color:var(--redpen)}
.wrong{margin-top:12px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--redpen) 7%,var(--page))}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.disc{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 4px;font-size:13.5px;font-weight:600;color:var(--pencil)}
.disc em{font-style:normal;color:var(--graphite);font-weight:600}
.disc:hover{text-decoration:underline;text-underline-offset:3px}
.q.ghost{background:none;box-shadow:inset 0 0 0 1px var(--blot2);color:var(--graphite);font-weight:600}.q.ghost:hover{background:var(--blotter);color:var(--pencil)}
.q.dash{background:none;box-shadow:none;border:1.5px dashed #bdb3a3;font-family:"Shantell Sans";font-size:13.5px}.q.dash:hover{background:var(--blotter)}.q.dash.on{background:var(--pencil);border-color:var(--pencil)}
.go{font-size:13.5px;font-weight:600;color:var(--pencil)}.go:hover{text-decoration:underline;text-underline-offset:3px}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--graphite)}.status::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--st)}.status.late::before{background:var(--redpen)}
.sel{height:32px;border:0;box-shadow:0 0 0 1.5px var(--blot2);border-radius:8px;padding:0 10px;background:var(--page);font-weight:600;font-size:13.5px}
.prov{display:grid;grid-template-columns:4px 1fr auto;gap:14px;align-items:center;padding:12px 14px;margin:0 -14px 4px;border-radius:14px}
.prov.on{background:var(--blotter)}.prov .cb{width:4px;height:34px;border-radius:4px;background:transparent}.prov.on .cb{background:var(--highlighter);box-shadow:0 0 0 1px var(--pencil)}
.mem{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mem span{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 11px;border-radius:8px;background:var(--blotter);font-size:13px}
.mem span button{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;color:var(--graphite)}.mem span button:hover{background:var(--blot2);color:var(--redpen)}
.ladder{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--graphite);flex-wrap:wrap;margin-top:10px}.ladder b{color:var(--pencil);font-weight:600;background:var(--page);box-shadow:0 0 0 1px var(--blot2);border-radius:7px;padding:3px 8px}
.tester{margin-top:14px;padding-top:14px;border-top:1px solid var(--blot2)}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;padding:18px 20px;border-radius:16px;background:var(--blotter);margin-bottom:12px}
.panel{background:var(--blotter);border-radius:12px;padding:14px 16px;margin:8px 0 10px}
.panel .ph{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ruleline{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--graphite);margin:0 0 8px}
.ruleline b{color:var(--pencil);font-weight:600}
.excs{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--blot2)}
.excs>div{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;gap:10px}
.dotc{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:8px;background:var(--c,var(--graphite))}
.shelf{display:flex;gap:8px;align-items:center;margin-top:18px}
.drop{border:1.5px dashed #cfc6b6;border-radius:var(--r);padding:22px;text-align:center;color:var(--graphite);margin:14px 0}
.toggle{display:inline-flex;width:34px;height:20px;border-radius:99px;background:#cfc6b6;position:relative;flex:none;cursor:pointer}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s ease-out}
.toggle.on{background:var(--pencil)}.toggle.on::after{transform:translateX(14px)}
.slim{display:flex;gap:10px;align-items:center;padding:10px 0}.slim input{height:38px;border:0;box-shadow:0 0 0 1.5px var(--pencil);border-radius:var(--r);padding:0 12px;background:var(--page);flex:1;outline:0}
.ta{width:100%;min-height:96px;border:0;box-shadow:0 0 0 1.5px var(--pencil);border-radius:var(--r);padding:10px 12px;background:var(--page);resize:none;display:block;outline:0}
.src{font-size:12.5px;color:var(--graphite);margin-top:6px}
.verdict{border-left:3px solid var(--highlighter);padding:4px 0 4px 14px;margin-top:16px;display:grid;gap:6px}
.all{display:grid;grid-template-columns:1fr 250px 110px 16px;gap:16px;padding:10px 14px;border-radius:16px;font-size:14.5px;align-items:center;cursor:pointer}
.all:hover{background:var(--blotter)}.cardw.open .all:hover{background:none}.all b{font-weight:600}
.all .d.late{color:var(--redpen)}.all .st{color:var(--graphite);font-size:13px}.all .d{text-align:right;color:var(--graphite);font-size:13px}
.chg{display:grid;grid-template-columns:110px 1fr auto;gap:14px;padding:9px 0;align-items:center;font-size:14.5px}
.chg .k{color:var(--graphite);font-size:13px}

/* talking to Inky */
.dock{width:720px;margin:0 auto;padding:10px 0 16px;flex:none;position:relative;z-index:3}
.cap{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12.5px;color:var(--graphite);margin:0 2px 8px}
.composer{display:flex;align-items:center;gap:8px;min-height:50px;padding:0 8px 0 12px;box-shadow:0 0 0 1.5px var(--pencil);border-radius:14px;background:var(--page)}
.composer input{flex:1;border:0;background:none;outline:0;height:48px;min-width:0}
.composer input::placeholder{color:var(--graphite)}
.send{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--highlighter);box-shadow:0 0 0 1.5px var(--pencil);transition:transform .1s ease-out,background-color .15s ease-out;flex:none}
.composer input:placeholder-shown~.send{background:var(--blotter);box-shadow:none;color:var(--graphite)}
.ref{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 4px 0 9px;border-radius:7px;background:var(--blotter);font-size:12.5px;font-weight:600;white-space:nowrap}
.ref button{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;color:var(--graphite)}
.sugg{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.dotnew{width:7px;height:7px;border-radius:50%;background:var(--redpen);display:inline-block}
.sheet{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:760px;max-height:calc(100% - 28px);background:var(--page);border-radius:20px 20px 0 0;box-shadow:0 0 0 1.5px var(--pencil),0 -18px 50px rgb(43 38 33/16%);display:flex;flex-direction:column;z-index:5;animation:rise .2s ease-out}
@keyframes rise{from{transform:translate(-50%,14px);opacity:0}}
.scrim{position:absolute;inset:0;background:rgb(251 247 238/78%);z-index:4}
.sheethead{display:flex;align-items:center;gap:12px;padding:18px 28px 8px}.sheethead h2{flex:1;font-size:19px}
.tl{flex:1;overflow:auto;padding:4px 28px 8px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}
.sheet .dockin{padding:10px 28px 20px}
.day{align-self:center;color:var(--graphite);font-size:12px;font-weight:600;margin-top:10px}
.msg{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.msg.you{justify-content:flex-end}.msg.you>div{background:var(--blotter);border-radius:14px 14px 4px 14px;padding:8px 13px;max-width:76%}
.msg.you .about{display:block;font-size:12px;color:var(--graphite);font-weight:600}
.msg.inky>div{padding-top:2px;max-width:84%}
.notes{display:grid;gap:2px;padding-left:36px}
.note{display:grid;grid-template-columns:64px 1fr;gap:8px;font-size:13px;color:var(--graphite);padding:3px 8px;margin-left:-8px;border-radius:7px;width:100%}
.note:hover{background:var(--blotter)}.note b{color:var(--pencil);font-weight:600}
.act{display:flex;width:max-content;max-width:100%;gap:10px;align-items:center;margin-top:8px;background:var(--blotter);border-radius:10px;padding:6px 6px 6px 12px;font-size:13px;font-weight:600}
.mini-tl{display:grid;gap:8px;margin-bottom:10px}.mini-tl .msg{font-size:13.5px}

/* week */
.weeknav{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:4px}
.dayc{min-height:168px;padding:6px;border-radius:12px}
.dayc.today{background:var(--blotter)}
.dayc .dn{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--graphite);padding:4px 4px 8px}
.dayc .dn i{font-style:normal;margin-left:auto;min-width:22px;height:22px;border-radius:50%;display:grid;place-items:center}
.dayc.today .dn{color:var(--pencil)}.dayc.today .dn i{background:var(--highlighter);box-shadow:0 0 0 1.5px var(--pencil)}
.wk{display:block;width:100%;padding:9px 10px 10px 13px;margin-bottom:6px;border-radius:10px;background:color-mix(in srgb,var(--c) 18%,var(--page));box-shadow:inset 3px 0 0 var(--c);transition:transform .1s ease-out,background-color .15s ease-out}
.wk:hover{background:color-mix(in srgb,var(--c) 28%,var(--page))}.wk:active{transform:scale(.97)}
.wk b{display:block;font-size:13.5px;font-weight:600;line-height:1.25}.wk span{display:block;color:var(--graphite);font-size:12px;margin-top:3px}.wk span.late{color:var(--redpen)}
.empty{font-size:12px;color:#b9b0a2;padding:4px}

/* work view */
.lhead{display:flex;align-items:center;gap:10px;height:58px;padding:0 24px;flex:none}
.lbody{display:grid;grid-template-columns:376px 1fr;flex:1;min-height:0}
.side{padding:6px 24px 18px;display:flex;flex-direction:column;overflow:auto;scrollbar-width:none;min-height:0}
.now{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.bro{display:flex;flex-direction:column;min-height:0;background:#f7f9fc;color:#243247;border-radius:16px 0 0 0;overflow:hidden;font-size:14px}
.urlbar{display:flex;gap:10px;align-items:center;height:40px;padding:0 14px;background:#e9edf4;font-size:12.5px;color:#5b6577;flex:none}
.urlbar .u{flex:1;background:#fff;border-radius:99px;padding:4px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.urlbar .drv{font-weight:700;color:#243247}
.school{flex:1;overflow:auto;scrollbar-width:thin}
.school header{background:#223a66;color:#fff;padding:10px 20px;font-weight:700;display:flex;justify-content:space-between}
.school header span{font-weight:400;opacity:.8}.school .pg{padding:20px 24px}.school h3{margin:0 0 12px;font-size:19px}
.qa{background:#fff;border:1px solid #d5dbe6;border-radius:8px;padding:12px 14px;margin-bottom:10px}
.ans{min-height:44px;margin-top:8px;border:1px solid #c3cddd;border-radius:6px;padding:8px 10px;background:#fbfcfe}
.ans.typing{border-color:#223a66;box-shadow:0 0 0 2px #f6c945}
